<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理 - 无人机及机巢 - Avant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="leaflet-hub.js"></script>
    <style>
        body {
            background-color: #141414;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }
        .leaflet-container { font-family: inherit; background: #0d1117; }
        .map-panel { position: relative; min-width:0; min-height:0; overflow:hidden; background:#0d1117; }

        .device-card.active {
            border-color: #58a6ff;
            background-color: rgba(31, 111, 235, 0.1);
        }
        /* 深色气泡（对齐迁移前假地图弹窗） */
        .leaflet-popup.drone-map-popup .leaflet-popup-content-wrapper {
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0,0,0,.55);
            padding: 0;
        }
        .leaflet-popup.drone-map-popup .leaflet-popup-content {
            margin: 0;
            width: 224px !important;
        }
        .leaflet-popup.drone-map-popup .leaflet-popup-tip {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            box-shadow: none;
        }
        .leaflet-popup.drone-map-popup .leaflet-popup-close-button {
            color: #8b949e !important;
            top: 6px !important;
            right: 8px !important;
            font-size: 16px !important;
            width: 18px;
            height: 18px;
            padding: 0 !important;
        }
        .leaflet-popup.drone-map-popup .leaflet-popup-close-button:hover {
            color: #fff !important;
        }
        .drone-bubble-hd {
            padding: 8px 28px 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .drone-bubble-hd .name { font-size: 12px; color: #fff; font-weight: 500; }
        .drone-bubble-hd .dot { margin: 0 4px; color: #6e7681; }
        .drone-bubble-hd .st { color: #9ca3af; }
        .drone-bubble-hd .link { font-size: 10px; color: #58a6ff; text-decoration: none; white-space: nowrap; margin-left: 8px; }
        .drone-bubble-hd .link:hover { text-decoration: underline; }
        .drone-bubble-bd { padding: 8px; }
        .drone-bubble-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .drone-bubble-thumb img {
            width: 100%; height: 100%; object-fit: cover; opacity: .8; display: block;
            transition: opacity .15s;
        }
        .drone-bubble-thumb:hover img { opacity: 1; }
        .drone-bubble-thumb .play {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,.7); font-size: 24px;
            transition: color .15s;
        }
        .drone-bubble-thumb:hover .play { color: #fff; }
        .drone-bubble-live {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: #d1d5db;
            background: #252525; border-radius: 4px;
            padding: 6px 8px; text-decoration: none;
            transition: background .15s, color .15s;
        }
        .drone-bubble-live:hover { background: #2d2d2d; color: #fff; }
        .drone-bubble-live .dot-live {
            width: 6px; height: 6px; border-radius: 9999px;
            background: #3fb950; margin-right: 8px; display: inline-block;
        }
        .drone-bubble-simple {
            padding: 8px 12px;
            font-size: 12px;
            color: #d4d4d4;
            white-space: nowrap;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航 -->
    <header class="h-12 bg-[#1e1e1e] border-b border-[#2d2d2d] flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center space-x-2 text-sm text-gray-400">
            <a href="javascript:history.back()" class="hover:text-white transition-colors flex items-center">
                <i class="fas fa-arrow-left mr-3 text-lg"></i>
            </a>
            <a href="project-home.html" class="hover:text-white transition-colors">项目首页</a>
            <span>/</span>
            <div class="relative" id="breadcrumbDropdown"><div class="flex items-center cursor-pointer hover:text-white text-white" onclick="event.stopPropagation(); var m=document.getElementById('breadcrumbMenu'); if(m) m.classList.toggle('hidden');">
                    <span>设备管理</span>
                    <i class="fas fa-chevron-down text-xs ml-1"></i>
                </div><div id="breadcrumbMenu" class="absolute left-0 top-full pt-1 w-36 hidden z-50">
                    <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded shadow-lg py-1">
                        <div class="px-4 py-2 bg-[rgba(88,166,255,0.1)] text-[#58a6ff] cursor-pointer" onclick="window.location.href='drone-list.html'">设备管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='task-live.html'">任务实况</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='camera-monitor.html'">监控中心</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='task-list.html'">任务管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='alert/alert-list.html'">告警中心</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='resource-list.html'">资源库</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='workflow-list.html'">自动化工作流</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <i class="fas fa-times cursor-pointer hover:text-white text-lg text-gray-400" onclick="location.href='project-home.html'" title="关闭"></i>
        </div>
    </header>

    <!-- 设备管理二级导航 (Tabs) -->
    <div class="bg-[#1e1e1e] border-b border-[#2d2d2d] px-4 flex space-x-8 text-sm shrink-0 z-10 relative">
        <div class="py-3 text-[#58a6ff] border-b-2 border-[#58a6ff] font-medium cursor-pointer flex items-center" onclick="location.href='drone-list.html'">
            <i class="fas fa-plane mr-2"></i> 无人机及机巢
        </div>
        <div class="py-3 text-gray-400 hover:text-gray-200 cursor-pointer flex items-center" onclick="location.href='camera-list.html'">
            <i class="fas fa-video mr-2"></i> 摄像头
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- 左侧列表区 -->
        <div class="w-96 bg-[#141414] border-r border-[#2d2d2d] flex flex-col z-10 shrink-0">
            
            <!-- 筛选区 -->
            <div class="p-3 border-b border-[#2d2d2d] flex space-x-2 shrink-0">
                <div class="w-20 bg-[#1e1e1e] border border-[#333] rounded px-2 py-1.5 flex items-center justify-between cursor-pointer hover:border-[#555] shrink-0">
                    <span class="text-xs text-gray-400">类型</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
                </div>
                <div class="w-20 bg-[#1e1e1e] border border-[#333] rounded px-2 py-1.5 flex items-center justify-between cursor-pointer hover:border-[#555] shrink-0">
                    <span class="text-xs text-gray-400">状态</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-500"></i>
                </div>
                <div class="relative flex-1 min-w-0">
                    <input type="text" placeholder="请搜索设备名" class="w-full bg-[#1e1e1e] border border-[#333] text-xs rounded pl-2 pr-8 py-1.5 focus:outline-none focus:border-[#58a6ff] text-white">
                    <i class="fas fa-search absolute right-2.5 top-2 text-gray-500 text-xs"></i>
                </div>
            </div>

            <!-- 设备列表 -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                
                <!-- 卡片 1 (选中) -->
                <div class="device-card active border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer transition-colors">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-plane text-gray-400 shrink-0"></i>
                        <span class="text-xs text-white truncate">007机巢576号677</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <div class="flex items-center text-[#f85149] text-[10px]" title="电量低"><i class="fas fa-battery-quarter mr-1"></i> 24%</div>
                        <span class="text-[10px] text-[#58a6ff]">已启用</span>
                        <i class="fas fa-chevron-right text-gray-500 text-[10px]"></i>
                    </div>
                </div>

                <!-- 卡片 2 -->
                <div class="device-card border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer hover:bg-[#1e1e1e] transition-colors">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-box text-gray-400 shrink-0"></i>
                        <span class="text-xs text-gray-300 truncate">J89</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <div class="flex items-center text-[#3fb950] text-[10px]" title="电量充足"><i class="fas fa-battery-full mr-1"></i> 94%</div>
                        <span class="text-[10px] text-[#58a6ff]">已启用</span>
                        <i class="fas fa-chevron-right text-gray-500 text-[10px]"></i>
                    </div>
                </div>

                <!-- 卡片 3 -->
                <div class="device-card border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer hover:bg-[#1e1e1e] transition-colors">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-plane text-gray-400 shrink-0"></i>
                        <span class="text-xs text-gray-300 truncate">007机巢576号677</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <div class="flex items-center text-[#f85149] text-[10px]"><i class="fas fa-battery-quarter mr-1"></i> 24%</div>
                        <span class="text-[10px] text-[#58a6ff]">已启用</span>
                        <i class="fas fa-chevron-right text-gray-500 text-[10px]"></i>
                    </div>
                </div>

                <!-- 卡片 4 -->
                <div class="device-card border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer hover:bg-[#1e1e1e] transition-colors">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-box text-gray-400 shrink-0"></i>
                        <span class="text-xs text-gray-300 truncate">J89</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <div class="flex items-center text-[#3fb950] text-[10px]"><i class="fas fa-battery-full mr-1"></i> 94%</div>
                        <span class="text-[10px] text-[#58a6ff]">已启用</span>
                        <i class="fas fa-chevron-right text-gray-500 text-[10px]"></i>
                    </div>
                </div>

                <!-- 卡片 5 (离线) -->
                <div class="device-card border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer hover:bg-[#1e1e1e] transition-colors opacity-60">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-box text-gray-500 shrink-0"></i>
                        <span class="text-xs text-gray-400 truncate">006机巢</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <span class="text-[10px] text-gray-500">离线</span>
                        <span class="text-[10px] text-[#58a6ff]">已启用</span>
                        <i class="fas fa-chevron-right text-gray-600 text-[10px]"></i>
                    </div>
                </div>
                
                <!-- 卡片 6 (离线/故障) -->
                <div class="device-card border border-[#333] rounded p-2.5 flex items-center justify-between cursor-pointer hover:bg-[#1e1e1e] transition-colors opacity-60">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <i class="fas fa-box text-gray-500 shrink-0"></i>
                        <span class="text-xs text-gray-400 truncate">006机巢</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <span class="text-[10px] text-gray-500">离线</span>
                        <span class="text-[10px] text-[#f85149]">已停用</span>
                        <i class="fas fa-chevron-right text-gray-600 text-[10px]"></i>

            </div>
        </div>

        <!-- 右侧地图区：Leaflet -->
        <div class="flex-1 map-panel relative z-0">
            <div id="drone-list-map" class="absolute inset-0 z-0"></div>
            <div class="absolute top-4 right-4 z-[500] flex space-x-2">
                <button class="bg-[#252525] border border-[#444] hover:bg-[#2d2d2d] text-gray-300 text-sm px-4 py-2 rounded shadow-lg transition-colors">无人机故障</button>
                <button class="bg-[#1f6feb] hover:bg-[#388bfd] text-white text-sm px-4 py-2 rounded shadow-lg transition-colors"><i class="fas fa-book mr-1"></i> 无人机添加指南</button>
            </div>
            <div class="absolute right-4 bottom-4 flex flex-col space-y-2 z-[500]">
                <button type="button" onclick="droneMap&&droneMap.zoomIn()" class="w-7 h-7 bg-[#1e1e1e] border border-[#333] rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] shadow-lg flex items-center justify-center"><i class="fas fa-plus text-xs"></i></button>
                <button type="button" onclick="droneMap&&droneMap.zoomOut()" class="w-7 h-7 bg-[#1e1e1e] border border-[#333] rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] shadow-lg flex items-center justify-center"><i class="fas fa-minus text-xs"></i></button>
                <button type="button" onclick="droneMap&&droneMap.setView([22.573,113.945],15)" class="w-7 h-7 bg-[#1e1e1e] border border-[#333] rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] shadow-lg flex items-center justify-center mt-2"><i class="fas fa-crosshairs text-xs"></i></button>
            </div>
        </div>
    </div>


<script>
(function(){
  document.addEventListener('click', function(e){
    var dd = document.getElementById('breadcrumbDropdown');
    var menu = document.getElementById('breadcrumbMenu');
    if (!dd || !menu) return;
    if (!dd.contains(e.target)) menu.classList.add('hidden');
  });
})();
</script>

<script src="custom-select.js"></script>

<script>
var droneMap = null;
document.addEventListener('DOMContentLoaded', function(){
  if (!window.HubMap) return;
  droneMap = HubMap.createMap('drone-list-map', { zoomControl: false, attributionControl: false, zoom: 14, center: [22.573, 113.945] });
  var popupOpts = { maxWidth: 240, className: 'drone-map-popup', closeButton: true };
  function nestIcon(){
    return L.divIcon({
      className: '',
      html: '<div style="width:24px;height:24px;border-radius:9999px;background:#3fb950;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff"><i class="fas fa-box" style="font-size:10px"></i></div>',
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -14]
    });
  }
  function droneIcon(sel){
    var glow = sel ? '0 0 12px #58a6ff' : '0 0 6px rgba(0,0,0,.4)';
    var ring = sel
      ? '<div style="position:absolute;inset:-6px;border-radius:9999px;border:1px solid #58a6ff;opacity:.7"></div><div style="position:absolute;inset:-3px;border-radius:9999px;border:2px solid #58a6ff;opacity:.9"></div>'
      : '';
    return L.divIcon({
      className: '',
      html: '<div style="position:relative;width:24px;height:24px">' + ring +
        '<div style="position:relative;z-index:1;width:24px;height:24px;border-radius:9999px;background:#58a6ff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:' + glow + '"><i class="fas fa-plane" style="font-size:10px"></i></div></div>',
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -14]
    });
  }
  function simpleBubble(text){
    return '<div class="drone-bubble-simple">' + text + '</div>';
  }
  function deviceBubble(name, status){
    return '' +
      '<div class="drone-bubble-hd">' +
        '<div class="name">' + name + '<span class="dot">•</span><span class="st">' + status + '</span></div>' +
        '<a class="link" href="drone-detail.html">详情</a>' +
      '</div>' +
      '<div class="drone-bubble-bd">' +
        '<div class="drone-bubble-thumb" onclick="location.href=\'drone-detail.html\'">' +
          '<img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=600&auto=format&fit=crop" alt="">' +
          '<div class="play"><i class="fas fa-play-circle"></i></div>' +
        '</div>' +
        '<a href="task-live.html" class="drone-bubble-live">' +
          '<div style="display:flex;align-items:center"><span class="dot-live"></span>设备实况</div>' +
          '<i class="fas fa-chevron-right" style="font-size:10px;color:#6b7280"></i>' +
        '</a>' +
      '</div>';
  }
  L.marker([22.578, 113.942], { icon: nestIcon() }).addTo(droneMap).bindPopup(simpleBubble('机巢 · 正常'), popupOpts);
  L.marker([22.570, 113.952], { icon: nestIcon() }).addTo(droneMap).bindPopup(simpleBubble('机巢 · 正常'), popupOpts);
  L.marker([22.575, 113.947], { icon: droneIcon(false) }).addTo(droneMap).bindPopup(simpleBubble('无人机 · 飞行中'), popupOpts);
  L.marker([22.568, 113.944], { icon: droneIcon(true) }).addTo(droneMap)
    .bindPopup(deviceBubble('西安设备1036', '在线'), popupOpts)
    .openPopup();
  setTimeout(function(){ droneMap.invalidateSize(); }, 100);
});
</script>
</body>
</html>
