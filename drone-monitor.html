<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无人机/机巢实况 - 监控中心 - Avant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #141414;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .dev-row.offline { opacity:.75; cursor:not-allowed; }
        .dev-row.displayed { background:rgba(31,111,235,.14); }

        /* 分屏网格 */
        #video-grid.mode-grid {
            display: grid;
            gap: 2px;
            background: #2d2d2d;
            height: 100%;
        }
        /* 瀑布：多列流式滚动 */
        #video-grid.mode-waterfall {
            display: block;
            column-count: 3;
            column-gap: 8px;
            height: auto;
            min-height: 100%;
            background: transparent;
            padding: 2px;
        }
        @media (max-width: 1400px) {
            #video-grid.mode-waterfall { column-count: 2; }
        }
        #video-grid.mode-waterfall .video-cell {
            break-inside: avoid;
            margin-bottom: 8px;
            height: 220px;
            display: flex;
            flex-direction: column;
        }

        .video-cell {
            border: 1px solid #30363d;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        .video-cell.active {
            border-color: #58a6ff;
        }
        .video-placeholder {
            background: repeating-linear-gradient(
                45deg,
                #161b22,
                #161b22 10px,
                #0d1117 10px,
                #0d1117 20px
            );
        }
        .layout-btn.on {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航 -->
    <header class="h-12 bg-[#1e1e1e] border-b border-[#2d2d2d] flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center space-x-2 text-sm text-gray-400">
            <a href="javascript:history.back()" class="hover:text-white transition-colors flex items-center">
                <i class="fas fa-arrow-left mr-3 text-lg"></i>
            </a>
            <a href="project-home.html" class="hover:text-white transition-colors">项目首页</a>
            <span>/</span>
            <div class="relative" id="breadcrumbDropdown"><div class="flex items-center cursor-pointer hover:text-white text-white" onclick="event.stopPropagation(); var m=document.getElementById('breadcrumbMenu'); if(m) m.classList.toggle('hidden');">
                    <span>监控中心</span>
                    <i class="fas fa-chevron-down text-xs ml-1"></i>
                </div><div id="breadcrumbMenu" class="absolute left-0 top-full pt-1 w-36 hidden z-50">
                    <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded shadow-lg py-1">
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='drone-list.html'">设备管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='task-live.html'">任务实况</div>
                        <div class="px-4 py-2 bg-[rgba(88,166,255,0.1)] text-[#58a6ff] cursor-pointer" onclick="window.location.href='camera-monitor.html'">监控中心</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='task-list.html'">任务管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='alert/alert-list.html'">告警中心</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='resource-list.html'">资源库</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='workflow-list.html'">自动化工作流</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <i class="fas fa-times cursor-pointer hover:text-white text-lg text-gray-400" onclick="location.href='project-home.html'" title="关闭"></i>
        </div>
    </header>

    <!-- 监控中心二级导航 -->
    <div class="bg-[#1e1e1e] border-b border-[#2d2d2d] px-4 flex space-x-8 text-sm shrink-0">
        <div class="py-3 text-[#58a6ff] border-b-2 border-[#58a6ff] font-medium cursor-pointer flex items-center">
            <i class="fas fa-plane mr-2"></i> 无人机/机巢实况
        </div>
        <div class="py-3 text-gray-400 hover:text-gray-200 cursor-pointer flex items-center" onclick="location.href='camera-monitor.html'">
            <i class="fas fa-video mr-2"></i> 摄像头监控
        </div>
    </div>

    <!-- 主体：左列表 + 中间实况（无右侧操控） -->
    <div class="flex-1 flex overflow-hidden">

        <div class="w-72 bg-[#141414] border-r border-[#2d2d2d] flex flex-col shrink-0">
            <div class="p-2 space-y-2 shrink-0">
                <div class="relative">
                    <input id="dev-search" type="text" oninput="onSearch(this.value)" placeholder="搜索设备名称/SN" class="w-full bg-[#1e1e1e] border border-[#333] text-xs rounded pl-8 pr-3 py-1.5 focus:outline-none focus:border-[#58a6ff] text-white">
                    <i class="fas fa-search absolute left-2.5 top-2 text-gray-500 text-xs"></i>
                </div>
                <div class="relative">
                    <select id="type-filter" onchange="setType(this.value)" class="w-full appearance-none bg-[#1e1e1e] border border-[#333] text-xs rounded pl-3 pr-8 py-1.5 text-gray-200 focus:outline-none focus:border-[#58a6ff] cursor-pointer">
                        <option value="all">全部类型</option>
                        <option value="drone">无人机</option>
                        <option value="nest">机巢</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-3 top-2.5 text-gray-500 text-[10px] pointer-events-none"></i>
                </div>
            </div>
            <div id="dev-list" class="p-2 flex-1 overflow-y-auto custom-scrollbar space-y-2"></div>
        </div>

        <div class="flex-1 flex flex-col p-2 min-w-0 min-h-0 bg-[#0d1117]">
            <div class="flex justify-between items-center mb-2 px-1 shrink-0">
                <div class="flex space-x-1 bg-[#1e1e1e] rounded border border-[#2d2d2d] p-0.5" id="layout-controls">
                    <button data-layout="waterfall" class="layout-btn on px-3 h-7 flex items-center justify-center rounded text-white transition-colors" onclick="setLayout('waterfall')"><i class="fas fa-stream mr-1.5"></i>瀑布</button>
                    <button data-layout="1" class="layout-btn px-3 h-7 flex items-center justify-center rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] transition-colors" onclick="setLayout(1)"><i class="fas fa-square mr-1.5"></i>1</button>
                    <button data-layout="2" class="layout-btn px-3 h-7 flex items-center justify-center rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] transition-colors" onclick="setLayout(2)"><i class="fas fa-columns mr-1.5"></i>2</button>
                    <button data-layout="4" class="layout-btn px-3 h-7 flex items-center justify-center rounded text-gray-400 hover:text-white hover:bg-[#2d2d2d] transition-colors" onclick="setLayout(4)"><i class="fas fa-th-large mr-1.5"></i>4</button>
                </div>
                <div class="flex items-center space-x-3 text-xs text-gray-400">
                    <span id="layout-hint">瀑布模式：点击左侧设备加入实况流</span>
                    <button class="px-3 py-1.5 bg-[#1e1e1e] border border-[#2d2d2d] rounded hover:text-white hover:bg-[#252525] transition-colors text-gray-300"><i class="fas fa-expand mr-1"></i> 全屏</button>
                </div>
            </div>

            <div id="video-stage" class="flex-1 min-h-0 rounded overflow-y-auto border border-[#2d2d2d] custom-scrollbar bg-[#0d1117]">
                <div id="video-grid" class="mode-waterfall"></div>
            </div>
        </div>
    </div>

    <script>
        const DRONE_IMG = 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1200&auto=format&fit=crop';
        const NEST_IMG  = 'https://images.unsplash.com/photo-1527977966376-1c8408f9f108?q=80&w=1200&auto=format&fit=crop';

        const NESTS = [
            { id:'nest1', name:'深圳站_机巢', sn:'SIMU-SZ-NEST01', online:true, signal:5, battery:100, rtk:'Fixed', stream:NEST_IMG,
              drone:{ id:'drone1', name:'深圳站evo_4T', sn:'SIMU-SZ-4T01', online:true, signal:1, battery:89, rtk:'Fixed', stream:DRONE_IMG } },
            { id:'nest2', name:'007机巢576号677', sn:'1581F4BFC1234567', online:true, signal:4, battery:100, rtk:'Fixed', stream:NEST_IMG,
              drone:{ id:'drone2', name:'无人机 M30T', sn:'SN-M30T-002', online:true, inTask:true, signal:3, battery:76, rtk:'Float', stream:DRONE_IMG } },
            { id:'nest3', name:'J89', sn:'SN-NEST-J89', online:false, signal:0, battery:0, rtk:'无', stream:NEST_IMG,
              drone:{ id:'drone3', name:'无人机 M300', sn:'SN-M300-003', online:false, signal:0, battery:0, rtk:'无', stream:DRONE_IMG } },
        ];

        let typeFilter = 'all';
        let keyword = '';
        /** @type {'waterfall'|1|2|4} */
        let layout = 'waterfall';
        /** 分屏固定槽位 */
        let slots = [null, null, null, null];
        /** 瀑布：已展示设备列表（有序） */
        let waterfallList = [];
        let activeId = null;

        function findDevice(id){
            for (const n of NESTS){
                if (n.id === id) return { ...n, type:'nest' };
                if (n.drone && n.drone.id === id) return { ...n.drone, type:'drone', nestName:n.name };
            }
            return null;
        }
        function displayedIds(){
            if (layout === 'waterfall') return waterfallList.map(d => d.id);
            const n = Number(layout);
            return slots.slice(0, n).filter(Boolean).map(d => d.id);
        }

        function rowHtml(d, iconType){
            const on = d.online;
            const disp = displayedIds().includes(d.id) ? 'displayed' : '';
            const click = on ? `onclick="event.stopPropagation(); selectDevice('${d.id}')"` : '';
            const statusBadge = on
                ? `<span class="ml-1 text-[10px] text-[#3fb950] bg-[#3fb950]/10 px-1 py-0.5 rounded border border-[#3fb950]/20 shrink-0">在线</span>`
                : `<span class="ml-1 text-[10px] text-gray-500 bg-gray-800 px-1 py-0.5 rounded border border-gray-600 shrink-0">离线</span>`;
            return `
            <div class="dev-row flex items-start px-2 py-1.5 rounded ${on ? 'cursor-pointer hover:bg-[#21262d]' : 'offline'} ${disp}" ${click} title="${on ? '点击展示实况' : '离线设备，不可展示实况'}">
                <i class="fas fa-${iconType} ${on ? 'text-gray-400' : 'text-gray-500'} mt-0.5 mr-2"></i>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center min-w-0">
                        <span class="text-xs ${on ? 'text-gray-300' : 'text-gray-400'} font-medium truncate" title="${d.name}">${d.name}</span>
                        ${statusBadge}
                    </div>
                    <div class="text-[10px] text-gray-500 font-mono truncate" title="${d.sn}">SN：${d.sn}</div>
                </div>
            </div>`;
        }
        function renderList(){
            const box = document.getElementById('dev-list');
            const kw = keyword.trim().toLowerCase();
            let html = '';
            NESTS.forEach(n => {
                const rows = [];
                const nestMatch = (n.name + n.sn).toLowerCase().includes(kw);
                const droneMatch = (n.drone.name + n.drone.sn).toLowerCase().includes(kw);
                if (typeFilter !== 'drone' && (!kw || nestMatch)) rows.push(rowHtml({ ...n }, 'box'));
                if (typeFilter !== 'nest'  && (!kw || droneMatch)) rows.push(rowHtml({ ...n.drone }, 'plane'));
                if (rows.length === 0) return;
                html += `<div class="border border-[#2d2d2d] rounded p-1 space-y-1">${rows.join('')}</div>`;
            });
            box.innerHTML = html || '<p class="text-center text-xs text-gray-600 py-6">无匹配设备</p>';
        }

        function onSearch(v){ keyword = v; renderList(); }
        function setType(t){ typeFilter = t; renderList(); }

        function signalIcon(level){
            const color = level >= 3 ? 'text-[#3fb950]' : level >= 1 ? 'text-[#d29922]' : 'text-[#f85149]';
            return `<span class="flex items-center ${color}"><i class="fas fa-signal mr-1"></i>${level}</span>`;
        }
        function batteryIcon(pct){
            const color = pct > 50 ? 'text-[#3fb950]' : pct > 20 ? 'text-[#d29922]' : 'text-[#f85149]';
            const ic = pct > 66 ? 'battery-full' : pct > 33 ? 'battery-half' : 'battery-quarter';
            return `<span class="flex items-center ${color}"><i class="fas fa-${ic} mr-1"></i>${pct}%</span>`;
        }
        function rtkBadge(rtk){
            const color = rtk === 'Fixed' ? 'text-[#3fb950]' : rtk === 'Float' ? 'text-[#d29922]' : 'text-gray-500';
            return `<span class="flex items-center ${color}"><i class="fas fa-satellite-dish mr-1"></i>RTK ${rtk}</span>`;
        }
        function osd(d){
            return `<div class="absolute top-9 right-2 z-20 flex items-center space-x-3 bg-black/60 rounded px-2 py-1 text-[11px] font-mono backdrop-blur">
                ${signalIcon(d.signal)}${batteryIcon(d.battery)}${rtkBadge(d.rtk)}
            </div>`;
        }

        /** 单机操控入口（本页不提供操控面板） */
        function goSinglePilot(deviceId, deviceName){
            const q = '?device=' + encodeURIComponent(deviceId || '') + '&name=' + encodeURIComponent(deviceName || '');
            location.href = 'drone-detail.html' + q + '#pilot';
        }

        function cellHtml(d, opts){
            const i = opts.index;
            const active = (d && d.id === activeId) || (opts.slotActive) ? 'active' : '';
            const isDrone = d && d.type === 'drone';
            const inTask = d && ((d.type === 'drone' && d.inTask) || (d.type === 'nest' && d.drone && d.drone.inTask));
            const pilotBtn = isDrone
                ? (inTask
                    ? `<button class="text-[10px] px-1.5 py-0.5 rounded border border-[#d29922]/40 text-[#d29922] hover:bg-[#d29922]/10" onclick="event.stopPropagation(); location.href='task-live.html?device=${encodeURIComponent(d.name)}'" title="任务中，查看任务实况">任务实况</button>`
                    : `<button class="text-[10px] px-1.5 py-0.5 rounded border border-[#58a6ff]/40 text-[#58a6ff] hover:bg-[#58a6ff]/10" onclick="event.stopPropagation(); goSinglePilot('${d.id}','${(d.name||'').replace(/'/g,"\\'")}')" title="前往单机操控">单机操控</button>`)
                : '';

            if (d){
                return `<div class="video-cell flex flex-col cursor-pointer ${active}" onclick="focusDevice('${d.id}', ${i})">
                    <div class="h-7 bg-[#141414]/90 absolute top-0 left-0 right-0 z-10 flex justify-between items-center px-2 text-xs border-b border-[#2d2d2d]">
                        <div class="flex items-center text-white font-medium min-w-0">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#3fb950] mr-1.5 shrink-0"></span>
                            <span class="truncate">${d.name}</span>
                            <span class="ml-1.5 text-[10px] text-gray-500 shrink-0">${d.type === 'nest' ? '机巢' : '无人机'}</span>
                        </div>
                        <div class="flex items-center space-x-2 text-gray-400 shrink-0">
                            ${pilotBtn}
                            <i class="fas fa-times hover:text-[#f85149] cursor-pointer" title="关闭" onclick="event.stopPropagation(); clearDevice('${d.id}', ${i})"></i>
                        </div>
                    </div>
                    <div class="flex-1 flex items-center justify-center relative overflow-hidden bg-black">
                        <img src="${d.stream}" class="absolute inset-0 w-full h-full object-cover opacity-90" alt="">
                        ${osd(d)}
                    </div>
                </div>`;
            }
            return `<div class="video-cell flex flex-col items-center justify-center text-gray-600 cursor-pointer ${active}" onclick="focusSlot(${i})">
                <div class="flex-1 video-placeholder w-full flex flex-col items-center justify-center relative overflow-hidden">
                    <i class="fas fa-video-slash text-2xl mb-2"></i>
                    <span class="text-xs">点击左侧设备添加画面</span>
                </div>
            </div>`;
        }

        function renderVideo(){
            const grid = document.getElementById('video-grid');
            const stage = document.getElementById('video-stage');
            const hint = document.getElementById('layout-hint');

            if (layout === 'waterfall'){
                grid.className = 'mode-waterfall';
                stage.classList.add('overflow-y-auto');
                stage.classList.remove('overflow-hidden');
                if (hint) hint.textContent = '瀑布模式：滚动浏览多路实况 · 操控请用「单机操控」';
                if (!waterfallList.length){
                    grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center text-gray-600 py-24" style="column-span:all">
                        <i class="fas fa-video-slash text-3xl mb-3"></i>
                        <span class="text-sm">点击左侧在线设备，加入瀑布实况</span>
                    </div>`;
                } else {
                    grid.innerHTML = waterfallList.map((d, i) => cellHtml(d, { index: i })).join('');
                }
                return;
            }

            const n = Number(layout);
            grid.className = 'mode-grid';
            stage.classList.remove('overflow-y-auto');
            stage.classList.add('overflow-hidden');
            grid.style.gridTemplateColumns = n === 1 ? '1fr' : '1fr 1fr';
            grid.style.gridTemplateRows = n === 4 ? '1fr 1fr' : '1fr';
            grid.style.height = '100%';
            if (hint) hint.textContent = '分屏模式：点击左侧设备 → 载入当前窗口 · 操控请用「单机操控」';
            let html = '';
            for (let i = 0; i < n; i++){
                const d = slots[i];
                html += cellHtml(d, { index: i, slotActive: (!d && activeId == null && i === 0) || (d && d.id === activeId) });
            }
            grid.innerHTML = html;
        }

        function resolvePair(id){
            let nestObj = null, droneObj = null;
            for (const n of NESTS){
                if (n.id === id || (n.drone && n.drone.id === id)){
                    nestObj = n.online ? { ...n, type: 'nest' } : null;
                    droneObj = (n.drone && n.drone.online) ? { ...n.drone, type: 'drone', nestName: n.name } : null;
                    break;
                }
            }
            return { nestObj, droneObj };
        }

        function upsertWaterfall(d){
            if (!d) return;
            if (waterfallList.some(x => x.id === d.id)) return;
            waterfallList.push(d);
        }

        function selectDevice(id){
            const d = findDevice(id);
            if (!d || !d.online) return;
            const { nestObj, droneObj } = resolvePair(id);

            if (layout === 'waterfall'){
                // 瀑布：成对加入（若对方在线且尚未展示）
                if (d.type === 'nest'){
                    upsertWaterfall(nestObj);
                    if (droneObj) upsertWaterfall(droneObj);
                } else {
                    upsertWaterfall(droneObj || d);
                    if (nestObj) upsertWaterfall(nestObj);
                }
                activeId = d.id;
                renderVideo(); renderList();
                return;
            }

            const n = Number(layout);
            const empty = [];
            for (let i = 0; i < n; i++) if (!slots[i]) empty.push(i);
            const pairLoadable = (n === 2 || n === 4) && empty.length >= 2 && nestObj && droneObj;
            if (pairLoadable){
                slots[empty[0]] = nestObj;
                slots[empty[1]] = droneObj;
                activeId = d.id;
            } else {
                let t = empty.length ? empty[0] : slots.findIndex(x => x && x.id === activeId);
                if (t < 0) t = 0;
                slots[t] = d;
                activeId = d.id;
            }
            renderVideo(); renderList();
        }

        function focusDevice(id, index){
            activeId = id;
            if (layout !== 'waterfall'){
                // keep
            }
            renderVideo();
        }
        function focusSlot(i){
            if (layout === 'waterfall') return;
            activeId = slots[i] ? slots[i].id : null;
            // mark slot focus via storing index in active when empty
            renderVideo();
        }
        function clearDevice(id, index){
            if (layout === 'waterfall'){
                waterfallList = waterfallList.filter(d => d.id !== id);
                if (activeId === id) activeId = waterfallList[0] ? waterfallList[0].id : null;
            } else {
                slots[index] = null;
                if (activeId === id) activeId = null;
            }
            renderVideo(); renderList();
        }

        function setLayout(mode){
            const prev = layout;
            layout = mode;
            document.querySelectorAll('#layout-controls .layout-btn').forEach(btn => {
                const on = String(btn.dataset.layout) === String(mode);
                btn.classList.toggle('on', on);
                btn.classList.toggle('text-white', on);
                btn.classList.toggle('text-gray-400', !on);
            });

            // 切到瀑布：把当前分屏里已有画面迁入瀑布
            if (mode === 'waterfall' && prev !== 'waterfall'){
                const n = Number(prev) || 4;
                for (let i = 0; i < n; i++){
                    if (slots[i]) upsertWaterfall(slots[i]);
                }
            }
            // 切到分屏：用瀑布列表前 N 路填充
            if (mode !== 'waterfall' && prev === 'waterfall'){
                const n = Number(mode);
                slots = [null, null, null, null];
                waterfallList.slice(0, n).forEach((d, i) => { slots[i] = d; });
                if (waterfallList[0]) activeId = waterfallList[0].id;
            }

            renderVideo();
            renderList();
        }

        /** 默认瀑布：载入全部在线设备实况 */
        function seedWaterfallOnline(){
            waterfallList = [];
            NESTS.forEach(n => {
                if (n.online) upsertWaterfall({ ...n, type: 'nest' });
                if (n.drone && n.drone.online) upsertWaterfall({ ...n.drone, type: 'drone', nestName: n.name });
            });
            activeId = waterfallList[0] ? waterfallList[0].id : null;
        }

        (function(){
            document.addEventListener('click', function(e){
                var dd = document.getElementById('breadcrumbDropdown');
                var menu = document.getElementById('breadcrumbMenu');
                if (dd && menu && !dd.contains(e.target)) menu.classList.add('hidden');
            });
            seedWaterfallOnline();
            setLayout('waterfall');
        })();
    </script>
</body>
</html>
