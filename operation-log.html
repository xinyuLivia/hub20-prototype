      font-size: 13px;
      min-width: 160px;

    table td { white-space: nowrap; }
    .dropdown { position: relative; min-width: 200px; }
    .dropdown-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 40;
      background: #1e1e1e;
      border: 1px solid #30363d;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      width: 100%;

    }

    .dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
      color: #d1d5db;
    }
    .dropdown-item:hover, .dropdown-item.active {
      background: #252525;
      color: #fff;
    }
    .cascader { position: relative; min-width: 200px; }
    .cascader-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 40;
      background: #1e1e1e;
      border: 1px solid #30363d;
      border-radius: 6px;

      min-width: 320px;
    }
    .cascader.open .cascader-panel { display: block; }
    .cascader-col {
      min-width: 120px;
      max-height: 260px;
      overflow-y: auto;
      border-right: 1px solid #2d2d2d;
    }
    .cascader-col:last-child { border-right: none; min-width: 180px; }

      padding: 8px 12px;
      cursor: pointer;
      color: #d1d5db;

      justify-content: space-between;

      background: #252525;
      color: #fff;
    }

      background: rgba(88, 166, 255, 0.12);
      color: #58a6ff;
      border-right: 2px solid #58a6ff;
    }

      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .modal-mask.show { display: flex; }
    .detail-modal-panel {
      width: 720px;
      max-width: 92vw;
      height: 560px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    #detailBody {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .muted-label { color: #6b7280; }
    .active-label { color: #fff; }
    .filter-wrap { position: relative; display: inline-flex; }
    .filter-wrap .form-ctl { padding-right: 28px; }
    .filter-clear {
      display: none;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);

      height: 18px;
      border: none;
      border-radius: 50%;

      color: #6b7280;

      justify-content: center;
      font-size: 12px;
      line-height: 1;
      z-index: 2;
    }

    <!-- 筛选：默认均为未选择态 -->
    <div class="px-5 py-3 shrink-0 flex flex-wrap items-center gap-3 border-b border-[#2d2d2d]">
      <div id="kwWrap" class="filter-wrap">
        <input id="kw" class="form-ctl w-[260px]" type="text"
          placeholder="账号 / 姓名 / 操作说明 / 对象ID / 对象名称"
          title="模糊搜索：操作人员账号、操作人员姓名、操作说明、操作对象ID、操作对象名称"
          oninput="updateClearButtons(); debounceApplyFilter()" />

      </div>

      <!-- 所属项目：可搜索单选 -->
      <div id="projectWrap" class="filter-wrap dropdown w-56">
        <button type="button" class="form-ctl w-full text-left flex items-center justify-between gap-2" onclick="toggleProject(event)">
          <span id="projectLabel" class="muted-label truncate flex-1">请选择所属项目</span>
          <i class="fas fa-chevron-down text-[10px] text-gray-500 shrink-0"></i>
        </button>
        <button type="button" id="projectClear" class="filter-clear" title="清空" onclick="clearProject(event)"><i class="fas fa-times"></i></button>
        <div class="dropdown-panel">
          <div id="projectClearRow" class="dropdown-item clear-option hidden" onclick="event.stopPropagation(); clearProject(event)">清空</div>

        </div>
      </div>

        </button>
        <button type="button" id="moduleClear" class="filter-clear" title="清空" onclick="clearModule(event)"><i class="fas fa-times"></i></button>

          <option value="失败" class="text-gray-200">失败</option>

      </div>

      </table>

    <div class="px-5 py-3 shrink-0 border-t border-[#2d2d2d] flex items-center justify-end gap-3 text-xs text-gray-400">
      <span id="totalLabel">共 0 条记录</span>
      <div class="flex items-center gap-1">
        <button class="px-2 py-1 rounded border border-[#30363d] hover:border-gray-500" onclick="gotoPage(page-1)">‹</button>
        <span id="pageNums" class="flex gap-1"></span>
        <button class="px-2 py-1 rounded border border-[#30363d] hover:border-gray-500" onclick="gotoPage(page+1)">›</button>
      </div>
      <select id="pageSize" class="form-ctl min-w-0 py-1" onchange="pageSize=+this.value; page=1; render();">
        <option value="10">10/页</option>
        <option value="20">20/页</option>
        <option value="50">50/页</option>
      </select>
    </div>
  </div>
  </div>

let filter = { kw:'', projectCode:'', domain:'', module:'', status:'', date:'' };
let page = 1, pageSize = 10;
let currentDetail = null;
let selectedL1 = '';

function closeAllPanels() {
  document.getElementById('projectWrap').classList.remove('open');
  document.getElementById('moduleWrap').classList.remove('open');
}
document.addEventListener('click', closeAllPanels);

function updateClearButtons() {
  const kw = document.getElementById('kw').value.trim();
  document.getElementById('kwWrap').classList.toggle('has-value', !!kw);

  const hasProject = !!filter.projectCode;
  document.getElementById('projectWrap').classList.toggle('has-value', hasProject);
  document.getElementById('projectClearRow').classList.toggle('hidden', !hasProject);

  const hasModule = !!filter.domain;
  document.getElementById('moduleWrap').classList.toggle('has-value', hasModule);
  document.getElementById('moduleClearRow').classList.toggle('hidden', !hasModule);

  const hasStatus = !!document.getElementById('status').value;
  document.getElementById('statusWrap').classList.toggle('has-value', hasStatus);

  const hasDate = !!document.getElementById('dateRange').value;
  document.getElementById('dateWrap').classList.toggle('has-value', hasDate);
}

function clearKw(e) {
  e.stopPropagation();
  document.getElementById('kw').value = '';
  applyFilter();
  updateClearButtons();
}

function clearProject(e) {
  e.stopPropagation();
  filter.projectCode = '';
  document.getElementById('projectLabel').textContent = '请选择所属项目';
  document.getElementById('projectLabel').className = 'muted-label truncate flex-1';
  document.getElementById('projectSearch').value = '';
  closeAllPanels();
  applyFilter();
  updateClearButtons();
}

function clearModule(e) {
  e.stopPropagation();
  filter.domain = '';
  filter.module = '';
  selectedL1 = '';
  document.getElementById('moduleLabel').textContent = '请选择操作模块';
  document.getElementById('moduleLabel').className = 'muted-label truncate flex-1';
  closeAllPanels();
  applyFilter();
  updateClearButtons();
}

function clearStatus(e) {
  e.stopPropagation();
  document.getElementById('status').value = '';
  applyFilter();
  updateClearButtons();
}

function clearDate(e) {
  e.stopPropagation();
  document.getElementById('dateRange').value = '';
  applyFilter();
  updateClearButtons();
}

function toggleProject(e) {
  e.stopPropagation();
  const el = document.getElementById('projectWrap');
  const wasOpen = el.classList.contains('open');
  closeAllPanels();
  if (!wasOpen) {
    el.classList.add('open');
    document.getElementById('projectSearch').value = '';
    renderProjectOptions();
    setTimeout(() => document.getElementById('projectSearch').focus(), 0);
  }
}

function renderProjectOptions() {
  const q = (document.getElementById('projectSearch').value || '').trim().toLowerCase();
  const box = document.getElementById('projectOptions');
  const list = PROJECTS.filter(p =>
    !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)
  );
  if (!list.length) {
    box.innerHTML = '<div class="px-3 py-4 text-gray-500 text-xs">无匹配项目</div>';
    return;
  }
  box.innerHTML = list.map(p => {
    const active = filter.projectCode === p.code ? 'active' : '';
    return `<div class="dropdown-item ${active}" onclick="event.stopPropagation(); selectProject('${p.code}')">
      <div class="text-gray-200">${p.name}</div>
      <div class="text-xs text-gray-500 mt-0.5">${p.code}</div>
    </div>`;
  }).join('');
}

function selectProject(code) {
  filter.projectCode = code;
  const p = PROJECTS.find(x => x.code === code);
  const label = document.getElementById('projectLabel');
  label.textContent = p ? p.name : '请选择所属项目';
  label.className = p ? 'active-label truncate flex-1' : 'muted-label truncate flex-1';
  closeAllPanels();
  applyFilter();
  updateClearButtons();
}

function toggleCascader(e) {
  e.stopPropagation();
  const el = document.getElementById('moduleWrap');
  const wasOpen = el.classList.contains('open');
  closeAllPanels();
  if (!wasOpen) {
    el.classList.add('open');
    renderCascaderL1();
  }
}

function renderCascaderL1() {
  const el = document.getElementById('moduleL1');
  el.innerHTML = Object.keys(MODULES).map(k =>
    `<div class="cascader-item ${selectedL1===k?'active':''}" onclick="event.stopPropagation(); selectL1('${k}')">
      ${k}<i class="fas fa-chevron-right text-[10px] text-gray-500"></i>
    </div>`
  ).join('');
  if (selectedL1) renderCascaderL2();
  else document.getElementById('moduleL2').innerHTML = '<div class="px-3 py-4 text-gray-500 text-xs">请先选择操作域</div>';
}

function selectL1(k) {
  selectedL1 = k;
  // filter.domain = k; // 移除：不再直接改变过滤条件
  // filter.module = '';
  // const label = document.getElementById('moduleLabel');
  // label.textContent = k + ' / 全部';
  // label.className = 'active-label truncate flex-1';
  renderCascaderL1();
  renderCascaderL2(); // 确保二级菜单渲染
  // applyFilter(); // 移除：不再触发查询
  // updateClearButtons();
}

function renderCascaderL2() {
  const el = document.getElementById('moduleL2');
  const mods = MODULES[selectedL1] || [];
  el.innerHTML = [
    `<div class="cascader-item ${!filter.module?'active':''}" onclick="event.stopPropagation(); selectL2('')">全部</div>`,
    ...mods.map(m =>
      `<div class="cascader-item ${filter.module===m?'active':''}" onclick="event.stopPropagation(); selectL2('${m}')">${m}</div>`
    )
  ].join('');
}

function selectL2(m) {
  filter.domain = selectedL1; // 此时才确定一级
  filter.module = m;
  const label = document.getElementById('moduleLabel');
  label.textContent = m ? `${selectedL1} / ${m}` : `${selectedL1} / 全部`;
  label.className = 'active-label truncate flex-1';
  closeAllPanels();
  applyFilter();
  updateClearButtons();
}

function applyFilter() {
  filter.kw = document.getElementById('kw').value.trim();
  filter.status = document.getElementById('status').value;
  filter.date = document.getElementById('dateRange').value;
  page = 1;
  render();
}

let applyTimer = null;
function debounceApplyFilter() {
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyFilter, 300);
}

function resetFilter() {
  filter = { kw:'', projectCode:'', domain:'', module:'', status:'', date:'' };
  selectedL1 = '';
  document.getElementById('kw').value = '';
  document.getElementById('status').value = '';
  document.getElementById('dateRange').value = '';
  document.getElementById('projectLabel').textContent = '请选择所属项目';
  document.getElementById('projectLabel').className = 'muted-label truncate flex-1';
  document.getElementById('moduleLabel').textContent = '请选择操作模块';
  document.getElementById('moduleLabel').className = 'muted-label truncate flex-1';
  document.getElementById('projectSearch').value = '';
  page = 1;
  render();
  updateClearButtons();
}

function filtered() {
  return LOGS.filter(r => {
    if (filter.kw) {
      const k = filter.kw.toLowerCase();
      const hit = (r.account||'').toLowerCase().includes(k)
        || (r.name||'').toLowerCase().includes(k)
        || (r.desc||'').toLowerCase().includes(k)
        || (r.objectId||'').toLowerCase().includes(k)
        || (r.objectName||'').toLowerCase().includes(k);
      if (!hit) return false;
    }
    if (filter.projectCode && r.projectCode !== filter.projectCode) return false;
    if (filter.domain && r.domain !== filter.domain) return false;
    if (filter.module && r.module !== filter.module) return false;
    if (filter.status && r.status !== filter.status) return false;
    return true;
  });
}

function render() {
  const rows = filtered();
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (page > pages) page = pages;
  const start = (page - 1) * pageSize;
  const slice = rows.slice(start, start + pageSize);

  document.getElementById('totalLabel').textContent = `共 ${total} 条记录`;
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if (!slice.length) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    tbody.innerHTML = slice.map((r, i) => {
      const statusDot = r.status === '成功'
        ? `<span class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>成功</span>`
        : `<span class="inline-flex items-center gap-1.5 text-red-400"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>失败</span>`;
      return `<tr class="border-b border-[#222] hover:bg-[#1a1a1a]">
        <td class="py-2.5 px-2 text-gray-500">${start + i + 1}</td>
        <td class="py-2.5 px-2 text-gray-200">${r.account}</td>
        <td class="py-2.5 px-2">${r.name || '—'}</td>
        <td class="py-2.5 px-2">${r.domain}</td>
        <td class="py-2.5 px-2 max-w-[140px] truncate" title="${r.projectName}">${r.projectName}</td>
        <td class="py-2.5 px-2 text-gray-400">${r.projectCode}</td>
        <td class="py-2.5 px-2">${r.module}</td>
        <td class="py-2.5 px-2">${r.type}</td>
        <td class="py-2.5 px-2 max-w-[180px] truncate" title="${r.desc}">${r.desc}</td>
        <td class="py-2.5 px-2 text-gray-400">${r.time}</td>
        <td class="py-2.5 px-2"><span class="text-[#58a6ff]">${r.method}</span></td>
        <td class="py-2.5 px-2 text-gray-400">${r.ip}</td>
        <td class="py-2.5 px-2">${statusDot}</td>
        <td class="py-2.5 px-2"><a href="javascript:;" class="text-[#58a6ff] hover:underline" onclick="openDetail(${r.id})">查看详情</a></td>
      </tr>`;
    }).join('');
  }

  const pageNums = document.getElementById('pageNums');
  let html = '';
  for (let p = 1; p <= pages; p++) {
    if (pages > 7 && p > 3 && p < pages - 1 && Math.abs(p - page) > 1) {
      if (p === 4 || p === pages - 2) html += `<span class="px-1">…</span>`;
      continue;
    }
    html += `<button class="min-w-[28px] px-2 py-1 rounded border ${p===page?'border-[#58a6ff] text-[#58a6ff]':'border-[#30363d] hover:border-gray-500'}" onclick="gotoPage(${p})">${p}</button>`;
  }
  pageNums.innerHTML = html;
}

function gotoPage(p) {
  const pages = Math.max(1, Math.ceil(filtered().length / pageSize));
  page = Math.min(Math.max(1, p), pages);
  render();
}

function openDetail(id) {
  currentDetail = LOGS.find(r => r.id === id);
  if (!currentDetail) return;
  const r = currentDetail;
  const statusHtml = r.status === '成功'
    ? `<span class="inline-flex items-center gap-1.5 text-emerald-400"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>成功</span>`
    : `<span class="inline-flex items-center gap-1.5 text-red-400"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>失败</span>`;
  const person = r.name ? `${r.name}（${r.account}）` : r.account;
  document.getElementById('detailHeader').innerHTML = `
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0 flex-1 text-white text-base font-medium leading-relaxed">${r.desc}</div>
      <div class="shrink-0">${statusHtml}</div>
    </div>
    <div class="grid grid-cols-2 gap-x-8 gap-y-2.5 pt-1">
      <div><span class="text-gray-500">操作模块及类型：</span><span class="text-gray-200">${r.module} · ${r.type}</span></div>
      <div><span class="text-gray-500">操作人员：</span><span class="text-gray-200">${person}</span></div>
      <div><span class="text-gray-500">操作时间：</span><span class="text-gray-200">${r.time}</span></div>
      <div><span class="text-gray-500">IP地址：</span><span class="text-gray-200">${r.ip}</span></div>
    </div>`;
  switchTab(r.status === '失败' ? 'exc' : 'basic');
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}

const TAB_ACTIVE = 'py-2.5 border-b-2 border-[#58a6ff] text-[#58a6ff]';
const TAB_IDLE = 'py-2.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200';

function esc(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function switchTab(tab) {
  const r = currentDetail;
  const basicBtn = document.getElementById('tabBasic');
  const excBtn = document.getElementById('tabExc');
  const body = document.getElementById('detailBody');
  basicBtn.className = TAB_IDLE;
  excBtn.className = TAB_IDLE;
  if (tab === 'basic') {
    basicBtn.className = TAB_ACTIVE;
    const duration = (r.durationMs == null || r.durationMs === '') ? '—' : `${r.durationMs} ms`;
    body.innerHTML = `
      <div class="text-sm space-y-5">
        <section>
          <div class="grid grid-cols-2 gap-x-10 gap-y-4">
            <div><div class="text-gray-500 mb-1">操作域</div><div class="text-gray-200">${esc(r.domain)}</div></div>
            <div><div class="text-gray-500 mb-1">请求方法</div><span class="inline-block px-2 py-0.5 rounded bg-[#0c2d48] text-[#58a6ff] border border-[#1a4a6e]">${esc(r.method)}</span></div>
            <div><div class="text-gray-500 mb-1">所属项目名称</div><div class="text-gray-200">${esc(r.projectName)}</div></div>
            <div><div class="text-gray-500 mb-1">所属项目编号</div><div class="text-gray-200">${esc(r.projectCode)}</div></div>
            <div><div class="text-gray-500 mb-1">耗时</div><div class="text-gray-200">${duration}</div></div>
          </div>
        </section>
        <div class="border-t border-[#2d2d2d]"></div>
        <section>
          <div class="text-gray-400 text-xs mb-3 tracking-wide">操作对象</div>
          <div class="grid grid-cols-2 gap-x-10 gap-y-4">
            <div><div class="text-gray-500 mb-1">操作对象 ID</div><div class="text-gray-200 font-mono">${esc(r.objectId || '—')}</div></div>
            <div><div class="text-gray-500 mb-1">操作对象名称</div><div class="text-gray-200">${esc(r.objectName || '—')}</div></div>
          </div>
        </section>
      </div>`;
  } else {
    excBtn.className = TAB_ACTIVE;
    if (r.error) {
      body.innerHTML = `<div class="rounded border border-red-900/60 bg-red-950/40 text-red-300 px-4 py-3 text-sm">${r.error}</div>`;
    } else {
      body.innerHTML = `<div class="text-gray-500 text-sm py-6 text-center">无异常信息</div>`;
    }
  }
}

document.getElementById('kw').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });
render();
updateClearButtons();
</script>
<script src="custom-select.js"></script>
</body>
