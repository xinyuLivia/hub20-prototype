<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增系统角色 - Avant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #141414;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .form-input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: #58a6ff; }
        
        /* Custom Checkbox */
        input[type="checkbox"] {
            appearance: none;
            background-color: #0d1117;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 14px;
            height: 14px;
            border: 1px solid #555;
            border-radius: 3px;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 8px;
            height: 8px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked {
            background-color: #1f6feb;
            border-color: #1f6feb;
        }
        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
        input[type="checkbox"]:indeterminate {
            background-color: #1f6feb;
            border-color: #1f6feb;
        }
        input[type="checkbox"]:indeterminate::before {
            transform: scale(1);
            clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-black/80 backdrop-blur-sm">

    <!-- Modal Container -->
    <div class="bg-[#161b22] border border-[#30363d] rounded-lg shadow-2xl w-[860px] flex flex-col max-h-[90vh]">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-[#30363d] flex justify-between items-center shrink-0">
            <h3 class="text-base font-medium text-white">新增系统角色</h3>
            <button class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times text-lg"></i></button>
        </div>

        <!-- Body -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
            <!-- Basic Info -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">角色名称 <span class="text-[#f85149]">*</span></label>
                    <div class="relative">
                        <input type="text" placeholder="请输入对象名称" class="form-input pr-12">
                        <span class="absolute right-3 top-2.5 text-xs text-gray-500">0/50</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5">角色描述</label>
                    <div class="relative">
                        <input type="text" placeholder="请输入角色描述" class="form-input pr-12">
                        <span class="absolute right-3 top-2.5 text-xs text-gray-500">0/50</span>
                    </div>
                </div>
            </div>

            <!-- Authorization Section -->
            <div>
                <label class="block text-xs text-gray-400 mb-2">功能资源授权</label>
                
                <div class="flex border border-[#30363d] rounded bg-[#0d1117] h-[400px]">
                    <!-- Left: Tree Selection -->
                    <div class="flex-1 flex flex-col border-r border-[#30363d]">
                        <div class="p-3 border-b border-[#30363d] flex items-center shrink-0">
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="checkbox-all" class="mr-2" onchange="toggleAll(this.checked)">
                                <span class="text-sm text-white font-medium">ALL</span>
                            </label>
                        </div>
                        <div class="flex-1 overflow-y-auto custom-scrollbar p-2" id="left-tree-container">
                            <!-- Left tree rendered via JS -->
                        </div>
                    </div>

                    <!-- Right: Selected Tree -->
                    <div class="w-[320px] flex flex-col bg-[#161b22]">
                        <div class="p-3 border-b border-[#30363d] flex justify-between items-center shrink-0">
                            <span class="text-sm text-white font-medium">已选 (<span id="selected-count">0</span>)</span>
                            <button class="text-gray-500 hover:text-white transition-colors" onclick="toggleAll(false)" title="清空已选">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="flex-1 overflow-y-auto custom-scrollbar p-2" id="right-tree-container">
                            <!-- Right tree rendered via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-6 py-4 border-t border-[#30363d] flex justify-end space-x-3 shrink-0 bg-[#161b22] rounded-b-lg">
            <button class="px-5 py-2 bg-[#21262d] text-gray-300 border border-[#30363d] rounded hover:bg-[#30363d] hover:text-white transition-colors text-sm">取消</button>
            <button class="px-5 py-2 bg-[#1f6feb] text-white rounded hover:bg-[#388bfd] transition-colors text-sm font-medium">确认</button>
        </div>
    </div>

    <script>
        const rawData = [
            { id: 'dashboard', label: '全局驾驶舱' },
            {
                id: 'admin',
                label: '管理后台',
                expanded: true,
                children: [
                    {
                        id: 'user-manage',
                        label: '用户管理',
                        expanded: true,
                        children: [
                            {
                                id: 'user-list',
                                label: '用户管理列表页面',
                                expanded: true,
                                children: [
                                    { id: 'user-edit', label: '编辑' },
                                    { id: 'user-view', label: '查看' },
                                    { id: 'user-delete', label: '删除' },
                                    { id: 'user-add', label: '新增用户' }
                                ]
                            },
                            { id: 'user-add-page', label: '新增用户页面' },
                            { id: 'user-view-demo', label: '查看用户资源示例' }
                        ]
                    },
                    { id: 'role-manage', label: '角色管理' }
                ]
            },
            {
                id: 'project',
                label: '项目管理',
                expanded: false,
                children: [
                    { id: 'proj-user-1', label: '用户管理' },
                    { id: 'proj-user-2', label: '用户管理' },
                    { id: 'proj-user-3', label: '用户管理' },
                    { id: 'proj-user-4', label: '用户管理' }
                ]
            }
        ];

        let nodesMap = {};

        function initTree(nodes, parent = null) {
            nodes.forEach(node => {
                node.parent = parent;
                node.checked = false;
                node.indeterminate = false;
                nodesMap[node.id] = node;
                if (node.children) {
                    initTree(node.children, node);
                }
            });
        }

        initTree(rawData);

        // Pre-select some nodes to match the image state (已选: 2 -> 用户管理 -> 用户管理列表页面)
        nodesMap['user-manage'].indeterminate = true;
        nodesMap['user-list'].checked = true;
        nodesMap['user-edit'].checked = true;
        nodesMap['user-view'].checked = true;
        nodesMap['user-delete'].checked = true;
        nodesMap['user-add'].checked = true;
        nodesMap['admin'].indeterminate = true;

        function setNodeChecked(id, checked) {
            const node = nodesMap[id];
            if (!node) return;
            
            function setDown(n, val) {
                n.checked = val;
                n.indeterminate = false;
                if (n.children) {
                    n.children.forEach(c => setDown(c, val));
                }
            }
            setDown(node, checked);
            
            function setUp(n) {
                if (!n.parent) return;
                const p = n.parent;
                const allChecked = p.children.every(c => c.checked);
                const someChecked = p.children.some(c => c.checked || c.indeterminate);
                
                p.checked = allChecked;
                p.indeterminate = !allChecked && someChecked;
                
                setUp(p);
            }
            setUp(node);
            
            updateAllCheckbox();
            renderLeftTree();
            renderRightTree();
        }

        function updateAllCheckbox() {
            const allChecked = rawData.every(c => c.checked);
            const someChecked = rawData.some(c => c.checked || c.indeterminate);
            const allCheckbox = document.getElementById('checkbox-all');
            if (allCheckbox) {
                allCheckbox.checked = allChecked;
                allCheckbox.indeterminate = !allChecked && someChecked;
            }
        }

        function toggleAll(checked) {
            rawData.forEach(node => {
                function setDown(n, val) {
                    n.checked = val;
                    n.indeterminate = false;
                    if (n.children) {
                        n.children.forEach(c => setDown(c, val));
                    }
                }
                setDown(node, checked);
            });
            updateAllCheckbox();
            renderLeftTree();
            renderRightTree();
        }

        function toggleExpand(id) {
            const node = nodesMap[id];
            if (node && node.children) {
                node.expanded = !node.expanded;
                renderLeftTree();
            }
        }

        function renderLeftTreeNodes(nodes, level = 0) {
            let html = '';
            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = node.expanded;
                
                html += `
                    <div class="flex flex-col">
                        <div class="flex items-center py-1.5 hover:bg-[#252525] rounded px-2 transition-colors" style="padding-left: ${level * 24 + 8}px">
                            ${hasChildren ? `
                                <div class="w-5 h-5 flex items-center justify-center cursor-pointer text-gray-500 hover:text-white mr-1" onclick="toggleExpand('${node.id}')">
                                    <i class="fas fa-chevron-${isExpanded ? 'down' : 'right'} text-[10px]"></i>
                                </div>
                            ` : `
                                <div class="w-5 mr-1"></div>
                            `}
                            <label class="flex items-center cursor-pointer flex-1 select-none">
                                <input type="checkbox" class="mr-2.5" 
                                    ${node.checked ? 'checked' : ''} 
                                    onchange="setNodeChecked('${node.id}', this.checked)">
                                <span class="text-sm ${node.checked || node.indeterminate ? 'text-white' : 'text-gray-400'}">${node.label}</span>
                            </label>
                        </div>
                        ${hasChildren && isExpanded ? `
                            <div class="flex flex-col">
                                ${renderLeftTreeNodes(node.children, level + 1)}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            return html;
        }

        function renderLeftTree() {
            const container = document.getElementById('left-tree-container');
            container.innerHTML = renderLeftTreeNodes(rawData, 0);
            
            Object.values(nodesMap).forEach(node => {
                if (node.indeterminate) {
                    const cb = container.querySelector(`input[onchange="setNodeChecked('${node.id}', this.checked)"]`);
                    if (cb) cb.indeterminate = true;
                }
            });
        }

        function getSelectedTree(nodes) {
            let result = [];
            nodes.forEach(node => {
                if (node.checked) {
                    let clone = { ...node, children: [] };
                    if (node.children) {
                        clone.children = getSelectedTree(node.children);
                    }
                    result.push(clone);
                } else if (node.indeterminate) {
                    let clone = { ...node, children: [] };
                    if (node.children) {
                        clone.children = getSelectedTree(node.children);
                    }
                    result.push(clone);
                }
            });
            return result;
        }

        function renderRightTreeNodes(nodes, level = 0) {
            let html = '';
            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                html += `
                    <div class="flex flex-col">
                        <div class="flex items-center justify-between py-1.5 hover:bg-[#252525] rounded px-2 group transition-colors" style="padding-left: ${level * 20 + 8}px">
                            <div class="flex items-center">
                                ${hasChildren ? `
                                    <div class="w-4 flex items-center justify-center text-gray-500 mr-1.5">
                                        <i class="fas fa-chevron-down text-[9px]"></i>
                                    </div>
                                ` : `
                                    <div class="w-4 mr-1.5 flex items-center justify-center text-gray-600">
                                        <div class="w-1 h-1 rounded-full bg-gray-600"></div>
                                    </div>
                                `}
                                <span class="text-sm text-gray-300">${node.label}</span>
                            </div>
                            <button class="w-5 h-5 flex items-center justify-center text-gray-500 hover:text-[#f85149] rounded opacity-0 group-hover:opacity-100 transition-all" onclick="setNodeChecked('${node.id}', false)" title="移除">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        ${hasChildren ? `
                            <div class="flex flex-col border-l border-[#30363d] ml-[15px] pl-1 my-0.5">
                                ${renderRightTreeNodes(node.children, 0)}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            return html;
        }

        function renderRightTree() {
            const selectedNodes = getSelectedTree(rawData);
            const container = document.getElementById('right-tree-container');
            
            let count = 0;
            Object.values(nodesMap).forEach(n => {
                if (n.checked) count++;
            });
            document.getElementById('selected-count').innerText = count;

            if (selectedNodes.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 space-y-3">
                        <i class="fas fa-check-square text-3xl opacity-20"></i>
                        <span class="text-xs">暂无已选功能资源</span>
                    </div>
                `;
            } else {
                container.innerHTML = renderRightTreeNodes(selectedNodes, 0);
            }
        }

        // Initial render
        updateAllCheckbox();
        renderLeftTree();
        renderRightTree();
    </script>
<script src="custom-select.js"></script>
</body>
</html>
