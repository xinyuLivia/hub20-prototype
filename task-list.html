<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - Avant Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background:#141414; color:#d4d4d4; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:13px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <header class="h-12 bg-[#1e1e1e] border-b border-[#2d2d2d] flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center space-x-2 text-sm text-gray-400">
            <a href="project-home.html" class="hover:text-white transition-colors flex items-center"><i class="fas fa-arrow-left mr-3 text-lg"></i></a>
            <a href="project-home.html" class="hover:text-white transition-colors">项目首页</a>
            <span>/</span>
            <div class="relative" id="breadcrumbDropdown"><div class="flex items-center cursor-pointer hover:text-white text-white" onclick="event.stopPropagation(); var m=document.getElementById('breadcrumbMenu'); if(m) m.classList.toggle('hidden');">
                    <span>任务管理</span>
                    <i class="fas fa-chevron-down text-xs ml-1"></i>
                </div><div id="breadcrumbMenu" class="absolute left-0 top-full pt-1 w-36 hidden z-50">
                    <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded shadow-lg py-1">
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='drone-list.html'">设备管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='task-live.html'">任务实况</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='camera-monitor.html'">监控中心</div>
                        <div class="px-4 py-2 bg-[rgba(88,166,255,0.1)] text-[#58a6ff] cursor-pointer" onclick="window.location.href='task-list.html'">任务管理</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='alert/alert-list.html'">告警中心</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='resource-list.html'">资源库</div>
                        <div class="px-4 py-2 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer text-gray-300" onclick="window.location.href='workflow-list.html'">自动化工作流</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <i class="fas fa-times cursor-pointer hover:text-white text-lg text-gray-400" onclick="location.href='project-home.html'" title="关闭"></i>
        </div>
    </header>
    <main class="flex-1 overflow-auto p-6">
        <h1 class="text-xl text-white font-medium mb-2">任务管理</h1>
        <p class="text-sm text-gray-500 mb-6">航线 / 计划 / 巡检任务 / 建模任务入口（原型占位页）。</p>
        <div class="grid grid-cols-2 gap-4 max-w-2xl">
            <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded-lg p-4 hover:border-[#58a6ff] cursor-pointer">
                <div class="text-white mb-1"><i class="fas fa-route text-[#58a6ff] mr-2"></i>航线管理</div>
                <div class="text-xs text-gray-500">管理巡检与建模航线</div>
            </div>
            <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded-lg p-4 hover:border-[#58a6ff] cursor-pointer">
                <div class="text-white mb-1"><i class="fas fa-calendar-alt text-[#58a6ff] mr-2"></i>计划管理</div>
                <div class="text-xs text-gray-500">周期计划与 Agent 计划</div>
            </div>
            <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded-lg p-4 hover:border-[#58a6ff] cursor-pointer">
                <div class="text-white mb-1"><i class="fas fa-tasks text-[#58a6ff] mr-2"></i>巡检任务</div>
                <div class="text-xs text-gray-500">创建与跟踪巡检任务</div>
            </div>
            <div class="bg-[#1e1e1e] border border-[#2d2d2d] rounded-lg p-4 hover:border-[#58a6ff] cursor-pointer">
                <div class="text-white mb-1"><i class="fas fa-cube text-[#58a6ff] mr-2"></i>建模任务</div>
                <div class="text-xs text-gray-500">三维建模任务管理</div>
            </div>
        </div>
    </main>

<script>
(function(){
  document.addEventListener('click', function(e){
    var dd = document.getElementById('breadcrumbDropdown');
    var menu = document.getElementById('breadcrumbMenu');
    if (!dd || !menu) return;
    if (!dd.contains(e.target)) menu.classList.add('hidden');
  });
})();
</script>

<script src="custom-select.js"></script>
</body>
</html>
